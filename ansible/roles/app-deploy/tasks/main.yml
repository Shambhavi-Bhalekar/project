---
- name: Create manifest directory
  file:
    path: /opt/k8s-manifests
    state: directory
    mode: '0755'

- name: Copy manifests
  copy:
    src: "{{ item }}"
    dest: "/opt/k8s-manifests/"
  with_fileglob:
    - "../../../../k8s/*.yaml"

- name: Apply namespace
  command: kubectl apply -f /opt/k8s-manifests/namespace.yaml

- name: Apply secrets
  command: kubectl apply -f /opt/k8s-manifests/secrets.yaml

- name: Apply deployments
  command: kubectl apply -f {{ item }}
  with_items:
    - /opt/k8s-manifests/auth.yaml
    - /opt/k8s-manifests/posts.yaml
    - /opt/k8s-manifests/frontend.yaml

- name: Apply ingress
  command: kubectl apply -f /opt/k8s-manifests/ingress.yaml

- name: Wait for rollout
  command: kubectl rollout status deployment/{{ item }} -n app --timeout=120s
  with_items:
    - auth-service
    - posts-service
    - frontend
