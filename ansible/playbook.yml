---
- name: Setup Docker on all nodes
  hosts: k8s
  become: yes
  roles:
    - docker-setup

- name: Setup Kubernetes tooling on all nodes
  hosts: k8s
  become: yes
  roles:
    - k8s-setup

- name: Deploy application to master
  hosts: masters
  become: yes
  vars:
    supabase_url: "{{ lookup('env', 'SUPABASE_URL') }}"
    supabase_key: "{{ lookup('env', 'SUPABASE_KEY') }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    k8s_master_ip: "{{ lookup('env', 'K8S_MASTER_IP') }}"
  tasks:
    - name: Create manifest directory on master
      file:
        path: /opt/k8s-manifests
        state: directory
        mode: '0755'

    - name: Copy all k8s manifests to master
      copy:
        src: "k8s/"
        dest: "/opt/k8s-manifests/"

    - name: Inject real values into secrets.yaml
      replace:
        path: /opt/k8s-manifests/secrets.yaml
        regexp: "REPLACE_WITH_YOUR_JWT_SECRET"
        replace: "{{ jwt_secret }}"

    - name: Inject master IP into ingress.yaml
      replace:
        path: /opt/k8s-manifests/ingress.yaml
        regexp: "YOUR_K8S_MASTER_IP"
        replace: "{{ k8s_master_ip }}"

    - name: Apply namespace
      command: kubectl apply -f /opt/k8s-manifests/namespace.yaml

    - name: Apply secrets
      command: kubectl apply -f /opt/k8s-manifests/secrets.yaml

    - name: Apply auth deployment
      command: kubectl apply -f /opt/k8s-manifests/auth.yaml

    - name: Apply posts deployment
      command: kubectl apply -f /opt/k8s-manifests/posts.yaml

    - name: Apply frontend deployment
      command: kubectl apply -f /opt/k8s-manifests/frontend.yaml

    - name: Apply ingress
      command: kubectl apply -f /opt/k8s-manifests/ingress.yaml

    - name: Wait for auth-service rollout
      command: kubectl rollout status deployment/auth-service -n app --timeout=120s

    - name: Wait for posts-service rollout
      command: kubectl rollout status deployment/posts-service -n app --timeout=120s

    - name: Wait for frontend rollout
      command: kubectl rollout status deployment/frontend -n app --timeout=120s
